name: Playwright Manual Run
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
      && format('Playwright {0} | {1}', inputs.suite, inputs.browser)
      || (github.event.schedule == '0 2 * * *'
        && 'Playwright regression-all | scheduled daily'
        || (github.event.schedule == '0 8 * * 5'
          && 'Playwright e2e-critical | scheduled weekly'
          || 'Playwright smoke | scheduled hourly'))
  }}

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run (recommended first run: smoke)"
        required: true
        default: all
        type: choice
        options:
          - all
          - smoke
          - smoke-dashboard
          - smoke-login
          - regression-all
          - regression-dashboard
          - regression-login
          - e2e-dashboard
          - e2e-login
          - e2e-critical
      browser:
        description: "Browser project (recommended first run: chromium)"
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
      grep:
        description: "Optional grep filter (example: @critical)"
        required: false
        default: ""
        type: string
      node_env:
        description: Environment file selector for src/config/.env.<NODE_ENV>
        required: false
        default: qa
        type: string
      publish_to_pages:
        description: "Publish report to GitHub Pages (recommended first run: false)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      retries:
        description: "Retries override (auto = 0 for non-critical, 2 for e2e-critical)"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - "0"
          - "1"
          - "2"
      workers:
        description: "Workers override (auto = 2 for non-critical, 1 for e2e-critical)"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - "1"
          - "2"
          - "3"
          - "4"
      timing_summary:
        description: "Show per-step timing summary in run output"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    - cron: '0 * * * *'
    - cron: '0 2 * * *'
    - cron: '0 8 * * 5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: ${{ inputs.node_env }}
      userid: ${{ secrets.HONEYCOMB_USERID }}
      password: ${{ secrets.HONEYCOMB_PASSWORD }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Initialize timing capture
        run: |
          echo "TIMINGS_FILE=$RUNNER_TEMP/playwright-timings.log" >> "$GITHUB_ENV"
          echo "JOB_START_TS=$(date +%s)" >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/playwright-timings.log"

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${userid:-}" ] || [ -z "${password:-}" ]; then
            {
              echo "## Configuration error"
              echo
              echo "Required GitHub Actions secrets are missing or empty."
              echo "- Expected: HONEYCOMB_USERID"
              echo "- Expected: HONEYCOMB_PASSWORD"
              echo
              echo "Set them in: Settings → Secrets and variables → Actions"
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::Missing required secrets HONEYCOMB_USERID and/or HONEYCOMB_PASSWORD"
            exit 1
          fi

      - name: Install dependencies
        run: |
          STEP_START=$(date +%s)
          npm ci
          STEP_END=$(date +%s)
          echo "Install dependencies|$((STEP_END - STEP_START))|" >> "$TIMINGS_FILE"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system dependencies
        run: |
          STEP_START=$(date +%s)
          npx playwright install-deps
          STEP_END=$(date +%s)
          echo "Install Playwright system dependencies|$((STEP_END - STEP_START))|" >> "$TIMINGS_FILE"

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          STEP_START=$(date +%s)
          npx playwright install
          STEP_END=$(date +%s)
          echo "Install Playwright browsers|$((STEP_END - STEP_START))|cache miss" >> "$TIMINGS_FILE"

      - name: Mark browser install from cache
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          echo "Install Playwright browsers|0|cache hit" >> "$TIMINGS_FILE"

      - name: Run selected Playwright suite
        shell: bash
        run: |
          set -euo pipefail
          STEP_START=$(date +%s)

          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$EVENT_SCHEDULE" = "0 2 * * *" ]; then
              SUITE="regression-all"
              BROWSER="chromium"
              GREP_FILTER=""
              RETRIES_INPUT="1"
              WORKERS_INPUT="2"
              PUBLISH_TO_PAGES="false"
              TIMING_SUMMARY="true"
            elif [ "$EVENT_SCHEDULE" = "0 8 * * 5" ]; then
              SUITE="e2e-critical"
              BROWSER="chromium"
              GREP_FILTER=""
              RETRIES_INPUT="2"
              WORKERS_INPUT="1"
              PUBLISH_TO_PAGES="false"
              TIMING_SUMMARY="true"
            else
              SUITE="smoke"
              BROWSER="chromium"
              GREP_FILTER=""
              RETRIES_INPUT="auto"
              WORKERS_INPUT="auto"
              PUBLISH_TO_PAGES="false"
              TIMING_SUMMARY="true"
            fi
          else
            SUITE="${{ inputs.suite }}"
            BROWSER="${{ inputs.browser }}"
            GREP_FILTER="${{ inputs.grep }}"
            RETRIES_INPUT="${{ inputs.retries }}"
            WORKERS_INPUT="${{ inputs.workers }}"
            PUBLISH_TO_PAGES="${{ inputs.publish_to_pages }}"
            TIMING_SUMMARY="${{ inputs.timing_summary }}"
          fi

          echo "Run mode: $EVENT_NAME | suite=$SUITE browser=$BROWSER retries=$RETRIES_INPUT workers=$WORKERS_INPUT publish_to_pages=$PUBLISH_TO_PAGES timing_summary=$TIMING_SUMMARY"

          if [ "$RETRIES_INPUT" = "auto" ]; then
            if [ "$SUITE" = "e2e-critical" ]; then
              RETRIES_VALUE="2"
            else
              RETRIES_VALUE="0"
            fi
          else
            RETRIES_VALUE="$RETRIES_INPUT"
          fi

          if [ "$WORKERS_INPUT" = "auto" ]; then
            if [ "$SUITE" = "smoke" ] || [ "$SUITE" = "smoke-dashboard" ] || [ "$SUITE" = "smoke-login" ] || [ "$SUITE" = "e2e-critical" ]; then
              WORKERS_VALUE="1"
            else
              WORKERS_VALUE="2"
            fi
          else
            WORKERS_VALUE="$WORKERS_INPUT"
          fi

          CMD=(npx playwright test)

          case "$SUITE" in
            all)
              ;;
            smoke)
              CMD+=(src/tests/smoke)
              ;;
            smoke-dashboard)
              CMD+=(src/tests/smoke/dashboard/dashboardSmoke.spec.ts)
              ;;
            smoke-login)
              CMD+=(src/tests/smoke/login/loginSmoke.spec.ts)
              ;;
            regression-all)
              CMD+=(src/tests/regression)
              ;;
            regression-dashboard)
              CMD+=(src/tests/regression/dashboard/dashboard.*.regression.spec.ts)
              ;;
            regression-login)
              CMD+=(src/tests/regression/login/login.*.regression.spec.ts)
              ;;
            e2e-dashboard)
              CMD+=(src/tests/e2e/dashboard/dashboardE2E.spec.ts)
              ;;
            e2e-login)
              CMD+=(src/tests/e2e/login/loginE2E.spec.ts)
              ;;
            e2e-critical)
              CMD+=(src/tests/e2e --grep @critical)
              ;;
            *)
              echo "Unsupported suite: $SUITE"
              exit 1
              ;;
          esac

          if [ "$BROWSER" != "all" ]; then
            CMD+=(--project="$BROWSER")
          fi

          if [ -n "$GREP_FILTER" ]; then
            CMD+=(--grep "$GREP_FILTER")
          fi

          CMD+=(--retries "$RETRIES_VALUE" --workers "$WORKERS_VALUE")

          echo "Running: ${CMD[*]}"

          set +e
          "${CMD[@]}"
          TEST_EXIT=$?
          set -e

          STEP_END=$(date +%s)
          echo "Run Playwright tests|$((STEP_END - STEP_START))|suite=$SUITE browser=$BROWSER retries=$RETRIES_VALUE workers=$WORKERS_VALUE" >> "$TIMINGS_FILE"

          exit "$TEST_EXIT"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Configure GitHub Pages
        if: always() && inputs.publish_to_pages == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always() && inputs.publish_to_pages == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy to GitHub Pages
        if: always() && inputs.publish_to_pages == 'true'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Print GitHub Pages URL
        if: always() && inputs.publish_to_pages == 'true' && steps.deployment.outcome == 'success'
        run: |
          echo "Live report URL: ${{ steps.deployment.outputs.page_url }}"

      - name: Warn when GitHub Pages publish fails
        if: always() && inputs.publish_to_pages == 'true' && steps.deployment.outcome != 'success'
        run: |
          echo "GitHub Pages publish failed or is not enabled for this repo." >> "$GITHUB_STEP_SUMMARY"
          echo "Enable Pages at: https://github.com/cameronindetroit/enterprise-playwright-automation-framework/settings/pages" >> "$GITHUB_STEP_SUMMARY"
          echo "Set Source to GitHub Actions, or run with publish_to_pages=false." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish timing summary
        if: always() && (github.event_name == 'schedule' || inputs.timing_summary == 'true')
        shell: bash
        run: |
          set -euo pipefail
          JOB_END_TS=$(date +%s)
          TOTAL_SECONDS=$((JOB_END_TS - JOB_START_TS))

          {
            echo "## Run timing summary"
            echo
            echo "| Step | Seconds | Notes |"
            echo "| --- | ---: | --- |"
            while IFS='|' read -r STEP_NAME STEP_SECONDS STEP_NOTES; do
              [ -z "$STEP_NAME" ] && continue
              echo "| $STEP_NAME | $STEP_SECONDS | ${STEP_NOTES:-} |"
            done < "$TIMINGS_FILE"
            echo "| Total job elapsed | $TOTAL_SECONDS | includes artifact/upload/deploy overhead |"
          } >> "$GITHUB_STEP_SUMMARY"